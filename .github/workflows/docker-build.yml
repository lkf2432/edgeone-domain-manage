# 构建并推送 Docker 镜像到 Docker Hub
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置以下 Secrets：
#   DOCKERHUB_USERNAME  - Docker Hub 用户名（如 gyc2432）
#   DOCKERHUB_TOKEN     - Docker Hub Access Token（Profile → Account Settings → Security → New Token）
#
# 触发条件：
#   - 推送到 main 分支（自动打 latest + sha 标签）
#   - 推送 v* 形式 tag，如 v1.2.3（自动打 1.2.3 / 1.2 / 1 / latest 标签）
#   - Actions 页面手动触发（workflow_dispatch）
#
# 镜像地址：docker.io/gyc2432/edgeone-domain-manage

name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: gyc2432/edgeone-domain-manage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 多架构构建需要 QEMU 模拟 arm64（飞牛 NAS 部分型号为 ARM 架构）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 自动生成镜像标签：latest / 语义版本 / 分支名 / commit sha
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "镜像构建完成，digest: ${{ steps.build-push.outputs.digest }}"
